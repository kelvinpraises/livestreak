[package]
name = "livestreak-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "LiveStreak engine views compiled to WASM — the ProtocolState blob reader for the TS SDK (byte-exact with the on-chain engine by construction)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
livestreak-engine = { path = "../livestreak-engine" }
livestreak-math = { path = "../livestreak-math" }
ruint = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
