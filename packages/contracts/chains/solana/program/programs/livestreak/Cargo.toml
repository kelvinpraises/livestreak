[package]
name = "livestreak"
version = "0.1.0"
description = "LiveStreak protocol — Solana port (ported from the Sui Move sources)"
license = "GPL-3.0-only"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "livestreak"

[features]
# custom-heap default: gates solana-program-entrypoint's custom_heap_default! (expanded in THIS
# crate by anchor's #[program]) so lib.rs's FREEING allocator replaces the never-freeing bump one.
default = ["custom-heap"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
ruint = { version = "1", default-features = false, features = ["alloc"] }
solana-define-syscall = "4"
livestreak-engine = { path = "../../crates/livestreak-engine" }
solana-keccak-hasher = "3.0"
linked_list_allocator = { version = "0.10", default-features = false }
livestreak-math = { path = "../../crates/livestreak-math" }

[dev-dependencies]
litesvm = "0.14.0"
litesvm-token = "0.14.0"
solana-message = "4.1"
solana-transaction = "4.1"
solana-signer = "3.0"
solana-keypair = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
